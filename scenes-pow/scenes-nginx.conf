server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;      # bound to NAS PowCache/scenes

    # Cross-origin: the viewer at splat.pow streams SOG chunks from scenes.pow
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;

    # nginx serves static with Accept-Ranges: bytes by default → progressive streaming
    location / {
        autoindex on;                # browse available scenes
        try_files $uri $uri/ =404;
        if ($request_method = OPTIONS) { return 204; }
    }
}
